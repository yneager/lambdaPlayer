<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#07080b" />
  <title>LAMBDA Player</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./window.css" />
  <link rel="stylesheet" href="./motion.css" />
</head>
<body>
  <main class="page-shell">
    <div class="drag-strip" data-drag aria-hidden="true"></div>
    <section class="player" data-drag-mini aria-label="LAMBDA Player interface">
      <div class="ambient ambient-a"></div>
      <div class="ambient ambient-b"></div>
      <div class="noise"></div>
      <div class="scanline"></div>

      <div class="poster" aria-hidden="true">
        <div class="poster-orb orb-one"></div>
        <div class="poster-orb orb-two"></div>
        <div class="poster-grid"></div>
        <div class="poster-horizon"></div>
      </div>

      <header class="topbar glass-panel" data-drag>
        <div class="brand-chip" role="button" tabindex="0" data-nodrag title="Back to Home" aria-label="Back to Home">
          <span class="brand-mark" aria-hidden="true">λ</span>
          <span>LAMBDA</span>
        </div>

        <div class="media-title">
          <span class="eyebrow">NOW PLAYING</span>
          <strong>Beyond the Synthetic Horizon</strong>
        </div>

        <div class="top-actions">
          <button class="icon-button soft" aria-label="Open file">
            <svg viewBox="0 0 24 24"><path d="M7 12v7a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-7M12 16V4m0 0L8 8m4-4 4 4"/></svg>
          </button>
          <button class="icon-button soft" aria-label="More options">
            <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
          </button>
          <div data-window-controls></div>
        </div>
      </header>

      <aside class="side-rail glass-panel" aria-label="Quick actions">
        <button class="rail-button active" aria-label="Player mode">
          <span class="rail-glow"></span>
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="rail-button" aria-label="Audio">
          <svg viewBox="0 0 24 24"><path d="M5 9v6h4l5 4V5L9 9H5zm12 1.5a3 3 0 0 1 0 3m1.8-5.2a6 6 0 0 1 0 7.4"/></svg>
        </button>
        <button class="rail-button" aria-label="Captions">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="4"/><path d="M10 10H8.5a2 2 0 0 0 0 4H10m5-4h-1.5a2 2 0 0 0 0 4H15"/></svg>
        </button>
        <button class="rail-button" aria-label="Cinema mode">
          <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="3"/><path d="M8 10h8M8 14h5"/></svg>
        </button>
      </aside>

      <div class="center-state" aria-hidden="true">
        <button class="play-core" tabindex="-1">
          <span class="pulse pulse-a"></span>
          <span class="pulse pulse-b"></span>
          <span class="play-inner">
            <svg viewBox="0 0 24 24"><path d="M9 6.5v11l9-5.5z"/></svg>
          </span>
        </button>
        <div class="center-copy">
          <span>READY</span>
          <strong>Press play to enter</strong>
        </div>
      </div>

      <div class="quality-badge glass-panel" aria-hidden="true">
        <span class="status-dot"></span>
        <span>4K</span>
        <i></i>
        <span>HDR</span>
      </div>

      <section class="control-deck glass-panel" aria-label="Playback controls">
        <div class="timeline-wrap">
          <div class="timeline-labels">
            <span>12:48</span>
            <span>42:16</span>
          </div>
          <div class="timeline">
            <div class="buffered"></div>
            <div class="progress"></div>
            <div class="timeline-glow"></div>
            <div class="thumb"></div>
          </div>
          <div class="chapter-row" aria-hidden="true">
            <span style="left: 18%"></span>
            <span style="left: 41%"></span>
            <span style="left: 68%"></span>
            <span style="left: 87%"></span>
          </div>
        </div>

        <div class="controls-row">
          <div class="control-cluster left">
            <button class="icon-button strong" aria-label="Play">
              <svg viewBox="0 0 24 24"><path d="M8.5 5.5v13l10-6.5z"/></svg>
            </button>
            <button class="icon-button" aria-label="Next">
              <svg viewBox="0 0 24 24"><path d="M6 6v12l9-6zM17 6v12"/></svg>
            </button>
            <div class="volume-pill">
              <button class="mini-button" aria-label="Volume">
                <svg viewBox="0 0 24 24"><path d="M5 9v6h4l5 4V5L9 9H5zm12 1.5a3 3 0 0 1 0 3"/></svg>
              </button>
              <div class="volume-track"><span></span></div>
            </div>
            <div class="timecode"><strong>12:48</strong><span>/ 42:16</span></div>
          </div>

          <div class="control-cluster center">
            <div class="scene-pill">
              <span class="scene-index">03</span>
              <span class="scene-copy"><small>CHAPTER</small><strong>Neon Fields</strong></span>
              <span class="scene-wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
            </div>
          </div>

          <div class="control-cluster right">
            <button class="text-button">1×</button>
            <button class="icon-button" aria-label="Audio">
              <svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>
            </button>
            <button class="icon-button" aria-label="Captions">
              <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="4"/><path d="M10 10H8.5a2 2 0 0 0 0 4H10m5-4h-1.5a2 2 0 0 0 0 4H15"/></svg>
            </button>
            <button class="icon-button" aria-label="Smoothness">
              <svg viewBox="0 0 24 24"><path d="M3 12h3m-1-4h4m-3 8h4"/><path d="M13 7a5 5 0 1 1 0 10"/><path d="M13 7h4.5m-4.5 10h4.5"/></svg>
            </button>
            <button class="icon-button fps-button" aria-label="Show FPS" aria-pressed="false">FPS</button>
            <button class="icon-button" aria-label="Mini player">
              <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><rect x="12" y="11" width="7" height="5" rx="1"/></svg>
            </button>
            <button class="icon-button strong subtle" aria-label="Fullscreen">
              <svg viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M8 21H3v-5m13 5h5v-5"/></svg>
            </button>
          </div>
        </div>
      </section>

      <div class="corner-mark corner-mark-tl"></div>
      <div class="corner-mark corner-mark-tr"></div>
      <div class="corner-mark corner-mark-bl"></div>
      <div class="corner-mark corner-mark-br"></div>
    </section>

    <p class="hint">LAMBDA Player · local playback</p>
  </main>
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script src="./window.js"></script>
  <script src="./player.js"></script>
</body>
</html>
