name: Build LAMBDA Player Windows Portable
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  stream-server:
    # Built-in streaming engine: stremio-native/stream-server (libtorrent) with
    # LAMBDA's loopback-only host. Pinned in tools/stream-server/versions.json;
    # the finished exe is cached until one of those inputs changes.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Cached engine
        id: engine-cache
        uses: actions/cache@v4
        with:
          path: stream-server-out
          key: lambda-stream-server-v1-${{ hashFiles('tools/stream-server/**') }}
      - name: Rust toolchain (pinned)
        if: steps.engine-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
      - name: Cargo registry cache
        if: steps.engine-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: engine-cargo-${{ hashFiles('tools/stream-server/versions.json') }}
      - name: vcpkg binary cache
        if: steps.engine-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: vcpkg-binary-cache
          key: engine-vcpkg-${{ hashFiles('tools/stream-server/versions.json', 'tools/stream-server/triplets/**') }}
      - name: Build lambda-stream-server.exe
        if: steps.engine-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $pins = Get-Content tools/stream-server/versions.json -Raw | ConvertFrom-Json
          git clone -q https://github.com/microsoft/vcpkg.git vcpkg
          git -C vcpkg checkout -q $pins.vcpkg.commit
          ./vcpkg/bootstrap-vcpkg.bat -disableMetrics
          New-Item -ItemType Directory -Force vcpkg-binary-cache | Out-Null
          $env:VCPKG_DEFAULT_BINARY_CACHE = Join-Path $PWD "vcpkg-binary-cache"
          $env:LIBCLANG_PATH = "C:/Program Files/LLVM/bin"
          ./tools/stream-server/build.ps1 -WorkDir (Join-Path $PWD "engine-build") -VcpkgRoot (Join-Path $PWD "vcpkg") -OutDir (Join-Path $PWD "stream-server-out")
      - uses: actions/upload-artifact@v4
        with:
          name: lambda-stream-server
          path: stream-server-out/

  build:
    needs: stream-server
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Verify release tag matches CMake version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $cmake = Get-Content CMakeLists.txt -Raw
          if ($cmake -notmatch 'project\(LambdaPlayer VERSION ([0-9]+\.[0-9]+\.[0-9]+)') {
            throw "Could not read LAMBDA Player version from CMakeLists.txt"
          }
          $expected = "v$($Matches[1])"
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "Tag $env:GITHUB_REF_NAME does not match CMake version $expected"
          }
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: "win64_msvc2022_64"
          modules: "qtwebengine qtwebchannel qtpositioning"
          cache: true
      - name: Download libmpv (pinned shinchiro/mpv-winbuild-cmake 20260923)
        shell: pwsh
        run: |
          # Pinned: this exact build was verified to include mpv's VapourSynth filter
          # (-Dvapoursynth=enabled) and to load VSScript.dll at runtime.
          $tag="20260923"
          $asset="mpv-dev-x86_64-20260923-git-6fd80b2003.7z"
          $sha="372F29C292D0C8B4CE916225739E5872E35B8E11F3F4590C285BAED8BA551100"
          $h=@{"User-Agent"="LAMBDA-Player-GitHub-Actions"}
          for($attempt=1;$attempt -le 3;$attempt++){
            try {
              Invoke-WebRequest -Headers $h -Uri "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/$tag/$asset" -OutFile mpv-dev.7z
              break
            } catch {
              if($attempt -eq 3){throw}
              Start-Sleep -Seconds (4*$attempt)
            }
          }
          $actual=(Get-FileHash mpv-dev.7z -Algorithm SHA256).Hash
          if($actual -ne $sha){throw "libmpv SHA-256 mismatch: expected $sha got $actual"}
          New-Item -ItemType Directory -Force deps\mpv|Out-Null
          7z x mpv-dev.7z "-odeps\mpv" -y
          $c=Get-ChildItem deps\mpv -Recurse -Filter client.h|Where-Object {$_.FullName -match '[\\/]mpv[\\/]client\.h$'}|Select-Object -First 1
          $d=Get-ChildItem deps\mpv -Recurse -Filter libmpv-2.dll|Select-Object -First 1
          if(!$d){$d=Get-ChildItem deps\mpv -Recurse -Filter mpv-2.dll|Select-Object -First 1}
          if(!$c -or !$d){throw "libmpv files missing"}
          "MPV_INCLUDE_ROOT=$(Split-Path (Split-Path $c.FullName -Parent) -Parent)"|Out-File $env:GITHUB_ENV -Append
          "MPV_DLL=$($d.FullName)"|Out-File $env:GITHUB_ENV -Append
      - name: Generate import library
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          powershell -NoProfile -ExecutionPolicy Bypass -File .github\scripts\make-mpv-lib.ps1 "%MPV_DLL%"
          echo MPV_LIB=%CD%\deps\mpv-import\mpv.lib>>%GITHUB_ENV%
      - name: Download bundled Inter font (pinned rsms/inter commit)
        shell: pwsh
        run: |
          $commit="353b61b9f4430d5f420d56605a6e7993e0941470"
          $url="https://raw.githubusercontent.com/rsms/inter/$commit/docs/font-files/InterVariable.woff2"
          $expected="693B77D4F32EE9B8BFC995589B5FAD5E99ADF2832738661F5402F9978429A8E3"
          New-Item -ItemType Directory -Force resources\vui|Out-Null
          for($attempt=1;$attempt -le 3;$attempt++){
            try {
              Invoke-WebRequest -Uri $url -OutFile resources\vui\InterVariable.woff2
              break
            } catch {
              if($attempt -eq 3){throw}
              Start-Sleep -Seconds (4*$attempt)
            }
          }
          $actual=(Get-FileHash resources\vui\InterVariable.woff2 -Algorithm SHA256).Hash
          Write-Host "InterVariable.woff2 SHA-256: $actual"
          if($actual -ne $expected){throw "Inter font SHA-256 mismatch: expected $expected got $actual"}
      - name: Fetch pinned Motrix download engine
        run: node tools/download-engine/fetch-engine.mjs --platform win32 --arch x64
      - name: Configure
        shell: pwsh
        run: |
          $releaseOptions = @()
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $releaseOptions = @("-DLAMBDA_RELEASE_TAG=$env:GITHUB_REF_NAME") }
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DMPV_INCLUDE_DIR="$env:MPV_INCLUDE_ROOT" -DMPV_LIBRARY="$env:MPV_LIB" @releaseOptions
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test (protocol, library, and updates)
        shell: pwsh
        run: |
          $env:PATH = "$env:QT_ROOT_DIR\bin;$env:PATH"
          $env:QT_QPA_PLATFORM = 'offscreen'
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "Native tests failed" }
          node --test tests/vui/downloads.test.cjs
          if ($LASTEXITCODE -ne 0) { throw "Download engine integration test failed" }
          node --test tests/vui/frame-clock.test.cjs
          if ($LASTEXITCODE -ne 0) { throw "UI frame clock tests failed" }
          node --test tests/vui/release-highlights.test.cjs
          if ($LASTEXITCODE -ne 0) { throw "Release highlights tests failed" }
          node --test tests/vui/torrent.test.cjs
          if ($LASTEXITCODE -ne 0) { throw "Torrent peer integration test failed" }
      - name: Package
        shell: pwsh
        run: |
          mkdir portable
          Copy-Item build\Release\LambdaPlayer.exe portable\
          Copy-Item tools\extra\win32\x64\aria2c.exe portable\
          Copy-Item licenses portable\ -Recurse -Force
          Copy-Item THIRD_PARTY_NOTICES.md portable\ -Force
          Copy-Item "$env:MPV_DLL" portable\libmpv-2.dll
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --release --no-translations --compiler-runtime portable\LambdaPlayer.exe
          $webProcess=Get-ChildItem portable -Recurse -Filter QtWebEngineProcess.exe|Select-Object -First 1
          $webResources=Get-ChildItem portable -Recurse -Filter qtwebengine_resources.pak|Select-Object -First 1
          if(!$webProcess -or !$webResources){throw "Qt WebEngine runtime resources were not deployed"}
      - uses: actions/download-artifact@v4
        with:
          name: lambda-stream-server
          path: stream-server-out
      - name: Bundle streaming engine
        shell: pwsh
        run: |
          Copy-Item stream-server-out/lambda-stream-server.exe portable/
          New-Item -ItemType Directory -Force portable/licenses | Out-Null
          Copy-Item stream-server-out/stream-server-LICENSE.txt portable/licenses/
          Copy-Item tools/stream-server/THIRD-PARTY.txt portable/licenses/
      - name: Bundle MSVC runtime DLLs (app-local, needed by Qt, VapourSynth and the RIFE plugin)
        shell: pwsh
        run: |
          $vs=& "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $crt=Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC143.CRT" -Directory|Sort-Object FullName -Descending|Select-Object -First 1
          if(!$crt){throw "MSVC redistributable CRT directory not found"}
          foreach($n in 'msvcp140.dll','msvcp140_1.dll','msvcp140_2.dll','msvcp140_atomic_wait.dll','msvcp140_codecvt_ids.dll','vcruntime140.dll','vcruntime140_1.dll','concrt140.dll'){
            $p=Join-Path $crt.FullName $n
            if(Test-Path $p){Copy-Item $p portable\ -Force}
          }
          Get-ChildItem portable\*.dll|Select-Object Name,Length
      - name: Assemble RIFE / VapourSynth runtime (pinned, SHA-256 verified)
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .github\scripts\assemble-rife-runtime.ps1 -PortableDir portable
      - name: List package
        shell: pwsh
        run: |
          Get-ChildItem portable -Recurse -File|Where-Object {$_.FullName -notmatch '\\vapoursynth\\[^\\]+$'}|Select-Object @{n='Path';e={$_.FullName.Substring((Resolve-Path portable).Path.Length)}},Length|Format-Table -AutoSize
          "Total size: {0:N1} MB" -f ((Get-ChildItem portable -Recurse -File|Measure-Object Length -Sum).Sum/1MB)
      - name: Smoke-test packaged app startup
        shell: pwsh
        run: |
          $exe = Join-Path (Resolve-Path portable).Path "LambdaPlayer.exe"
          $process = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe -Parent) -PassThru
          Start-Sleep -Seconds 5
          $process.Refresh()
          if ($process.HasExited) {
            throw "LAMBDA Player exited during startup smoke test with code $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id -Force
      - name: Smoke-test the bundled streaming engine
        shell: pwsh
        run: |
          $dir = (Resolve-Path portable).Path
          $info = New-Object System.Diagnostics.ProcessStartInfo
          $info.FileName = Join-Path $dir "lambda-stream-server.exe"
          $info.Arguments = "--port 0 --config-dir `"$env:RUNNER_TEMP/engine-config`" --cache-dir `"$env:RUNNER_TEMP/engine-cache`""
          $info.UseShellExecute = $false
          $info.RedirectStandardOutput = $true
          $info.RedirectStandardInput = $true
          $info.RedirectStandardError = $true
          $engine = [System.Diagnostics.Process]::Start($info)
          $read = $engine.StandardOutput.ReadLineAsync()
          if (-not $read.Wait(30000)) { throw "engine did not report ready" }
          $line = $read.Result
          Write-Host $line
          if ($line -notmatch '^LAMBDA_STREAM_SERVER_READY (http://127\.0\.0\.1:\d+)$') { throw "unexpected engine output: $line" }
          $settings = Invoke-RestMethod "$($Matches[1])/settings"
          if (-not $settings.values) { throw "engine /settings answered without values" }
          $engine.StandardInput.Close()
          if (-not $engine.WaitForExit(10000)) { $engine.Kill(); throw "engine did not stop when stdin closed" }
      - uses: actions/upload-artifact@v4
        with:
          name: LAMBDA-Player-Windows-x64
          path: portable/
      - name: Create release archive
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $archive = "LAMBDA-Player-Windows-x64-$env:GITHUB_REF_NAME.zip"
          Compress-Archive -Path portable\* -DestinationPath $archive -Force
          "RELEASE_ASSET=$archive" | Out-File $env:GITHUB_ENV -Append
      - name: Create Windows installer
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $compiler = Join-Path $env:RUNNER_TEMP 'inno\ISCC.exe'
          $compilerSetup = Join-Path $env:RUNNER_TEMP 'innosetup-6.5.3.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_5_3/innosetup-6.5.3.exe' -OutFile $compilerSetup
          if ((Get-FileHash $compilerSetup).Hash -ne '9345EE029FAA0B7AED0818C3D5B227699EF9A496CCE79E20C19EB9D6EF2E2C2D') { throw 'Installer compiler checksum mismatch' }
          $compilerDirectory = Split-Path $compiler -Parent
          $setup = Start-Process $compilerSetup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER','/NOICONS',("/DIR=`"$compilerDirectory`"")) -WindowStyle Hidden -PassThru -Wait
          if ($setup.ExitCode -ne 0) { throw 'Installer compiler setup failed' }
          $output = Join-Path $env:RUNNER_TEMP 'lambda-installer'
          & ./packaging/build-test-package.ps1 -AppDir portable -BuildExe build/Release/LambdaPlayer.exe -BuildCache build/CMakeCache.txt -QtDir $env:QT_ROOT_DIR -Compiler $compiler -OutputDir $output
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer build failed' }
          $installer = Get-ChildItem $output -Filter 'LAMBDA-Player-Setup-*-x64.exe' | Select-Object -First 1
          if (!$installer) { throw 'Windows installer was not generated' }
          "RELEASE_INSTALLER=$($installer.FullName)" | Out-File $env:GITHUB_ENV -Append
          "RELEASE_CHECKSUM=$output\SHA256.txt" | Out-File $env:GITHUB_ENV -Append
          # Publish the same complete runtime used by the installer for native updates.
          $update = Get-ChildItem $output -Filter 'LAMBDA-Player-Windows-x64-*.zip' | Select-Object -First 1
          "RELEASE_ASSET=$($update.FullName)" | Out-File $env:GITHUB_ENV -Append
          "RELEASE_FEED=$output\update-feed.json" | Out-File $env:GITHUB_ENV -Append
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "docs/releases/$env:GITHUB_REF_NAME.md"
          gh release view "$env:GITHUB_REF_NAME" *> $null
          if ($LASTEXITCODE -eq 0) {
            # Published update assets are immutable: cached feed checksums must remain valid.
            Write-Host "Release $env:GITHUB_REF_NAME already exists; keeping its published assets."
          } else {
            $releaseOptions = @()
            if ($env:GITHUB_REF_NAME.Contains('-')) { $releaseOptions = @('--prerelease','--latest=false') }
            if (Test-Path $notes) {
              gh release create "$env:GITHUB_REF_NAME" "$env:RELEASE_ASSET" "$env:RELEASE_INSTALLER" "$env:RELEASE_CHECKSUM" "$env:RELEASE_FEED" --verify-tag --title "LAMBDA Player $env:GITHUB_REF_NAME" --notes-file "$notes" @releaseOptions
            } else {
              gh release create "$env:GITHUB_REF_NAME" "$env:RELEASE_ASSET" "$env:RELEASE_INSTALLER" "$env:RELEASE_CHECKSUM" "$env:RELEASE_FEED" --verify-tag --title "LAMBDA Player $env:GITHUB_REF_NAME" --generate-notes @releaseOptions
            }
            if ($LASTEXITCODE -ne 0) { throw "Release creation failed" }
          }
